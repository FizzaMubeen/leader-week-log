name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - index.html
      - icons/**
      - android-app/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare the web app
        run: npm run prepare-web

      - name: Create the Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#13212B' --iconBackgroundColorDark '#13212B' \
            --splashBackgroundColor '#13212B' --splashBackgroundColorDark '#13212B'
          npx cap sync android

      - name: Set the version
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Building a signed release APK"
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            ./gradlew assembleRelease --no-daemon
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks release.jks --ks-key-alias leaderweeklog \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out ../LeaderWeekLog.apk aligned.apk
            "$BT/apksigner" verify ../LeaderWeekLog.apk
            rm -f release.jks
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing key found: building a test APK"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../LeaderWeekLog.apk
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LeaderWeekLog-${{ env.VERSION_NAME }}
          path: android-app/LeaderWeekLog.apk

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          if [ "$SIGNED" = "true" ]; then
            NOTES="Leader Week Log for Android, version ${VERSION_NAME}. Download LeaderWeekLog.apk on your phone and open it to install. Updates install over the previous version and keep your data."
            gh release create "$TAG" LeaderWeekLog.apk --title "Leader Week Log ${VERSION_NAME}" --notes "$NOTES" --latest
          else
            NOTES="Test build ${VERSION_NAME}. This APK uses a temporary signing key, so a later version cannot install over it. Download a backup in Settings before switching to the next version."
            gh release create "$TAG" LeaderWeekLog.apk --title "Test build ${VERSION_NAME}" --notes "$NOTES" --prerelease
          fi
